# writereditor.yaml — 公文撰写、PPT 大纲与生成、代码编写与 diff 补丁
#
# `allowed` 是**收窄清单**：实际生效取 profile 白名单 ∩ 本列表。
# v1 不给 ast_inspect：撰写者按大纲写，不需要符号级结构查询。

onion_id: writereditor
role: 公文撰写、PPT 大纲与生成、代码编写与 diff 补丁
profile: coder
allowed: [read_text_file, list_files, grep_files, edit_file, write_file,
          run_python, write_artifact_file, read_own_card]
# 轮数不设 max_turn：三段式派发与主/子 agent 共用同一安全网
# （bot/constants.rs MAX_ROUNDS）；自定义配置档需要快停时可自行声明。
temperature: 0.2
hooks:
  post_tool: ""             # 预留：产物写后清洗/格式化
