<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>任务页 · 周时间网格 — 视觉小样 v2</title>
<style>
  /* ══════ token（与 src/ui/main.css 对齐 + 方案 §5 新增） ══════ */
  :root {
    --bg: #eef1f6; --surface: #fafbfd; --surface-raised: #ffffff;
    --edge: #e2e7ef; --edge-strong: #cbd4e1;
    --inset-bg: rgba(23, 32, 51, 0.075);
    --shadow-sm: 0 1px 2px rgba(23, 32, 51, 0.06);
    --shadow-lg: 0 8px 24px rgba(23, 32, 51, 0.14);
    --t1: #182031; --t2: #2b3548; --t3: #45506a; --t4: #525e7a; --t5: #5d6984;
    --brand: #5f6f94;
    --accent: #5b64d8;
    --glass-bg: rgba(255, 255, 255, 0.66);
    --now: #e5484d;
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  }
  html.dark {
    --bg: #14161d; --surface: #1b1f29; --surface-raised: #232836;
    --edge: #272d3b; --edge-strong: #3a4254;
    --inset-bg: rgba(0, 0, 0, 0.3);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.55);
    --t1: #eef1f7; --t2: #dbe1ec; --t3: #b6bfd0; --t4: #8d97ac; --t5: #808a9e;
    --brand: #a3b6dd;
    --accent: #8a91f0;
    --glass-bg: rgba(27, 31, 41, 0.60);
    --now: #ff6b62;
  }
  /* 计划块色板（方案 §5.1） */
  :root, html.dark {
    --plan-blue: #4f7cf5; --plan-teal: #2fb8ad; --plan-green: #46c283;
    --plan-amber: #e89b3c; --plan-violet: #8b5cf6; --plan-slate: #7a86a0;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--t2);
    transition: background-color 0.15s ease, color 0.15s ease;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* ══════ 应用框架 ══════ */
  .app { display: flex; height: 100vh; }

  /* 导航栏（简化复刻） */
  .rail {
    width: 208px; flex: none; display: flex; flex-direction: column; gap: 2px;
    border-right: 1px solid var(--edge); padding: 12px;
  }
  .rail .logo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; }
  .rail .logo .mark {
    width: 22px; height: 22px; border-radius: 7px;
    background: linear-gradient(135deg, var(--brand), var(--accent));
    opacity: 0.9;
  }
  .rail .logo b { font-size: 13px; font-weight: 600; color: var(--t2); }
  .rail .newtask {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    padding: 7px 10px; border-radius: var(--r-sm);
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
    box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  html.dark .rail .newtask { color: #101228; }
  .rail .search {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    padding: 7px 10px; border-radius: var(--r-sm);
    background: var(--inset-bg); border: 1px solid var(--edge);
    color: var(--t5); font-size: 13px;
  }
  .rail .search kbd {
    margin-left: auto; font-size: 10px; color: var(--t5);
    border: 1px solid var(--edge); border-radius: 4px; padding: 1px 4px;
  }
  .rail .sect { font-size: 11px; color: var(--t5); padding: 10px 8px 4px; }
  .rail .item {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 10px; border-radius: var(--r-sm);
    font-size: 13px; color: var(--t4);
  }
  .rail .item .ico { flex: none; opacity: 0.8; }
  .rail .item.active { background: var(--surface-raised); border: 1px solid var(--edge); color: var(--t1); font-weight: 500; }
  .rail .spring { flex: 1; }

  /* 主区 */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px 24px 24px; }

  /* 页头 */
  .pagehead { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: var(--r-sm);
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
    box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 32%, transparent);
  }
  html.dark .btn-primary { color: #101228; }
  .weeknav { display: inline-flex; align-items: center; gap: 4px; }
  .weeknav .range { font-size: 15px; font-weight: 600; color: var(--t1); margin: 0 6px; }
  .iconbtn {
    width: 28px; height: 28px; border-radius: var(--r-sm);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--t4); border: 1px solid transparent;
  }
  .iconbtn:hover { background: var(--inset-bg); color: var(--t2); }
  .chip {
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--edge); color: var(--t3); background: var(--surface);
  }
  .chip:hover { border-color: var(--edge-strong); }
  .pagehead .spring { flex: 1; }
  .pool-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: var(--r-sm); font-size: 12.5px;
    border: 1px solid var(--edge); color: var(--t3); background: var(--surface);
  }
  .pool-toggle .count {
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
  }
  html.dark .pool-toggle .count { color: #101228; }

  /* 内容行：详情面板（左，文档流） + 网格（右） */
  .body-row { flex: 1; min-height: 0; display: flex; gap: 16px; }

  /* ══════ 毛玻璃面板（任务池 / 详情共用） ══════ */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid var(--edge);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
  }
  @supports not (backdrop-filter: blur(1px)) {
    .glass { background: var(--surface); }
  }

  /* ══════ 详情面板（左） ══════ */
  .detail {
    width: 292px; flex: none; padding: 18px; overflow-y: auto;
  }
  .body-row.no-detail .detail { display: none; }
  .detail .dtitle {
    width: calc(100% - 30px); border: none; outline: none; background: transparent;
    font-size: 16px; font-weight: 600; color: var(--t1); line-height: 1.4;
  }
  .detail .close { float: right; margin: -4px -6px 0 0; }
  .detail .sect { font-size: 11px; font-weight: 500; color: var(--t5); margin: 18px 0 8px; letter-spacing: 0.02em; }
  .planbox {
    border: 1px solid var(--edge); border-radius: var(--r-md);
    background: var(--surface); padding: 12px;
  }
  .planbox .row { display: flex; align-items: center; gap: 8px; }
  .planbox input[type="datetime-local"] {
    flex: 1; padding: 6px 8px; border-radius: var(--r-sm);
    border: 1px solid var(--edge); background: var(--inset-bg);
    color: var(--t2); font: inherit; font-size: 12.5px; font-variant-numeric: tabular-nums;
    outline: none;
  }
  .stepper { display: inline-flex; align-items: center; margin-top: 10px; }
  .stepper button {
    width: 26px; height: 26px; border: 1px solid var(--edge);
    color: var(--t3); font-size: 14px;
  }
  .stepper button:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
  .stepper button:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
  .stepper button:hover { background: var(--inset-bg); }
  .stepper .val {
    min-width: 62px; text-align: center; padding: 4px 8px;
    border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    font-size: 12.5px; font-weight: 500; color: var(--t1); font-variant-numeric: tabular-nums;
  }
  .quick { display: flex; gap: 6px; margin-top: 10px; }
  .quick button {
    padding: 4px 9px; border-radius: 999px; border: 1px solid var(--edge);
    font-size: 11.5px; color: var(--t4); font-variant-numeric: tabular-nums;
  }
  .quick button.on { border-color: var(--accent); color: var(--accent); font-weight: 500; }
  .planbox .clear { margin-top: 10px; font-size: 11.5px; color: var(--t5); }
  .planbox .clear:hover { color: var(--t3); }
  .detail .field { font-size: 12.5px; color: var(--t4); line-height: 1.55; }
  .tagrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11.5px; color: var(--t4); padding: 2px 9px;
    border: 1px solid var(--edge); border-radius: 999px; background: var(--inset-bg);
  }
  .sub { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--t3); padding: 4px 0; }
  .sub .box {
    width: 14px; height: 14px; border-radius: 4px; flex: none;
    border: 1px solid var(--edge-strong);
  }
  .sub.done { color: var(--t5); text-decoration: line-through; }
  .sub.done .box { background: var(--plan-green); border-color: var(--plan-green); position: relative; }
  .sub.done .box::after {
    content: ""; position: absolute; inset: 3px 3px 5px;
    border-left: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(-45deg) scale(0.8);
  }
  .detail .foot { display: flex; gap: 8px; margin-top: 20px; }
  .btn-done {
    flex: 1; padding: 8px 0; border-radius: var(--r-sm);
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
  }
  html.dark .btn-done { color: #101228; }
  .btn-del {
    width: 36px; border-radius: var(--r-sm); border: 1px solid var(--edge);
    color: var(--t5); font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-del:hover { color: #dc2626; border-color: #dc2626; }

  /* ══════ 周网格 ══════ */
  .gridwrap { flex: 1; min-width: 0; position: relative; display: flex; }
  .well {
    flex: 1; min-width: 0; position: relative;
    background: var(--inset-bg); border: 1px solid var(--edge);
    border-radius: var(--r-lg);
    padding: 0 0 8px 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* 暗色氛围辉光：井内左下紫 / 右下青，两团低透明 radial（仅暗色） */
  .dark .well::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    border-radius: inherit;
    background:
      radial-gradient(480px 340px at 10% 100%, color-mix(in srgb, #7c5cff 13%, transparent), transparent 70%),
      radial-gradient(520px 360px at 98% 96%, color-mix(in srgb, #2fb8ad 10%, transparent), transparent 70%);
  }
  /* 列头行 */
  .dayhead {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 52px repeat(7, 1fr);
    padding: 10px 8px 8px; gap: 0;
  }
  .dayhead .cell { text-align: center; position: relative; }
  .dayhead .dow { font-size: 11px; color: var(--t5); margin-bottom: 3px; }
  .dayhead .dnum {
    font-size: 19px; font-weight: 600; color: var(--t3);
    font-variant-numeric: tabular-nums; line-height: 1.15;
    width: 28px; height: 28px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .dayhead .cell.today .dow { color: var(--accent); font-weight: 500; }
  .dayhead .cell.today .dnum { background: var(--accent); color: #fff; }
  html.dark .dayhead .cell.today .dnum { color: #101228; }
  .dayhead .cell.weekend .dow, .dayhead .cell.weekend .dnum { color: var(--t5); opacity: 0.8; }
  .dayhead .cell.today.weekend .dnum { color: #fff; opacity: 1; }
  html.dark .dayhead .cell.today.weekend .dnum { color: #101228; }

  /* 网格主体：时刻轴 + 7 列（虚线刻度行由 JS 生成，垫在列下层） */
  .gridbody { flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: 52px repeat(7, 1fr); padding: 0 8px 0 0; }
  .hours { position: relative; z-index: 2; }
  .hours span {
    position: absolute; right: 10px; transform: translateY(-6px);
    font-size: 10.5px; color: var(--t5); font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--bg) 60%, transparent);
    padding: 1px 3px; border-radius: 4px;
  }
  .hline {
    position: absolute; left: 52px; right: 8px; z-index: 0;
    border-top: 1px dashed color-mix(in srgb, var(--edge-strong) 62%, transparent);
    pointer-events: none;
  }
  .hline.hh { border-top-color: color-mix(in srgb, var(--edge-strong) 26%, transparent); }
  .col {
    position: relative; z-index: 1;
    border-left: 1px solid color-mix(in srgb, var(--edge) 55%, transparent);
  }
  .col:first-of-type { border-left: none; }
  .col.weekend::before {
    content: ""; position: absolute; inset: 0;
    background: var(--inset-bg); opacity: 0.5; pointer-events: none;
  }
  .col.today::after {
    content: ""; position: absolute; inset: 0;
    background: color-mix(in srgb, var(--accent) 6%, transparent); pointer-events: none;
  }
  /* 落点吸附指示：拖拽时的目标格 */
  .slot {
    position: absolute; z-index: 1; left: 3px; right: 3px;
    border-radius: var(--r-md); pointer-events: none;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent);
  }
  /* 现在时刻线：珊瑚红 + 「现在」标签（整页唯一的活体信号） */
  .nowline {
    position: absolute; left: -4px; right: 8px; height: 0; z-index: 4;
    border-top: 2px solid var(--now); pointer-events: none;
  }
  .nowline::before {
    content: ""; position: absolute; left: -3px; top: -5px;
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--now);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--now) 22%, transparent);
  }
  .nowline .lab {
    position: absolute; left: 10px; top: -10px; line-height: 1;
    font-size: 10.5px; font-weight: 600; color: #fff;
    background: var(--now); padding: 3px 8px; border-radius: 999px;
    box-shadow: 0 2px 8px color-mix(in srgb, var(--now) 40%, transparent);
    font-variant-numeric: tabular-nums;
  }

  /* ══════ 计划块 ══════
     亮色 = 粉彩淡底（14% 混色 + 左色条）
     暗色 = 饱和渐变实色 + 色彩辉光投影 + 白字 + 起止锚点（参考图气质） */
  .blk {
    position: absolute; left: 3px; right: 3px; z-index: 3; cursor: grab;
    border-radius: var(--r-md);
    padding: 7px 10px 6px;
    background: color-mix(in srgb, var(--c) 14%, var(--surface-raised));
    border: 1px solid color-mix(in srgb, var(--c) 26%, transparent);
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.12s ease, transform 0.12s ease, opacity 0.15s ease, filter 0.15s ease;
    touch-action: none;
  }
  .blk::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--c); border-radius: 3px 0 0 3px;
  }
  .blk .t {
    font-size: 12px; font-weight: 500; color: var(--t1); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .blk .tm {
    position: absolute; right: 9px; bottom: 5px;
    font-size: 10px; color: var(--t4); font-variant-numeric: tabular-nums; opacity: 0.85;
  }
  .blk:hover { transform: translateY(-1px); }
  .blk.sel {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm), 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  /* 暗色：块成为主角 */
  .dark .blk {
    background: linear-gradient(150deg,
      color-mix(in srgb, var(--c) 86%, white) 0%,
      var(--c) 52%,
      color-mix(in srgb, var(--c) 78%, black) 100%);
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
    box-shadow:
      0 4px 16px color-mix(in srgb, var(--c) 32%, transparent),
      inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  .dark .blk::before { display: none; }
  .dark .blk .t { color: #fff; font-weight: 600; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18); }
  .dark .blk .tm { color: rgba(255, 255, 255, 0.85); }
  .dark .blk:hover {
    transform: translateY(-2px);
    box-shadow:
      0 8px 24px color-mix(in srgb, var(--c) 45%, transparent),
      inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  .dark .blk.sel {
    border-color: rgba(255, 255, 255, 0.85);
    box-shadow:
      0 0 0 2px color-mix(in srgb, var(--c) 60%, transparent),
      0 6px 20px color-mix(in srgb, var(--c) 48%, transparent),
      inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  /* 起止锚点（仅暗色；落在块角外的「端点」） */
  .blk .dot {
    display: none; position: absolute; width: 7px; height: 7px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 38%, transparent);
  }
  .dark .blk .dot { display: block; }
  .blk .dot.s { top: -3px; left: -3px; }
  .blk .dot.e { bottom: -3px; right: -3px; }
  /* 底缘拉伸握把：hover 浮现 */
  .blk .grip {
    position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
    width: 22px; height: 5px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.6);
    opacity: 0; transition: opacity 0.12s ease; cursor: ns-resize;
  }
  html:not(.dark) .blk .grip { background: color-mix(in srgb, var(--c) 55%, transparent); }
  .blk:hover .grip { opacity: 1; }
  .blk.tiny .tm { display: none; }
  .blk.fresh { animation: blk-pop 0.22s cubic-bezier(0.2, 1.4, 0.4, 1); }
  @keyframes blk-pop {
    0% { transform: scale(0.88); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 图例悬停过滤：不同色块退场 */
  .gridbody.filtering .blk { opacity: 0.18; filter: saturate(0.25); }
  .gridbody.filtering .blk.f-match { opacity: 1; filter: none; }
  /* 跨日分段：贴列底/列顶的开口 + 续接标记 */
  .blk.tail { border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; border-bottom-color: transparent; }
  .blk.head { border-top-left-radius: 3px; border-top-right-radius: 3px; border-top-color: transparent; }
  .blk .cont {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 11px; font-weight: 700; color: var(--c); line-height: 1;
  }
  .dark .blk .cont { color: rgba(255, 255, 255, 0.9); }
  .blk.tail .cont { bottom: 2px; }
  .blk.head .cont { top: 2px; }
  /* 同列重叠分栏 */
  .blk.half { width: calc(50% - 4px); }
  .blk.half.r { left: auto; }
  /* 拖拽幽灵（跟指针，吸附 30 分钟） */
  .ghost {
    position: fixed; z-index: 50; pointer-events: none;
    width: 180px; border-radius: var(--r-md); padding: 7px 10px;
    background: color-mix(in srgb, var(--c) 82%, black);
    border: 1px solid color-mix(in srgb, var(--c) 70%, transparent);
    box-shadow: 0 12px 32px color-mix(in srgb, var(--c) 50%, transparent);
    opacity: 0.92;
  }
  .ghost .t { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ghost .gt { font-size: 10px; color: rgba(255, 255, 255, 0.85); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .dragging-src { opacity: 0.35; }

  /* ══════ 任务池（毛玻璃悬浮层） ══════ */
  .pool {
    position: absolute; top: 12px; right: 12px; bottom: 12px; width: 258px; z-index: 6;
    display: flex; flex-direction: column; overflow: hidden;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
  }
  .gridwrap.pool-closed .pool { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
  .pool .phead {
    display: flex; align-items: center; gap: 8px; padding: 13px 14px 11px;
    border-bottom: 1px solid color-mix(in srgb, var(--edge) 70%, transparent);
  }
  .pool .phead b { font-size: 13px; font-weight: 600; color: var(--t1); }
  .pool .phead .count { font-size: 11px; color: var(--t5); font-variant-numeric: tabular-nums; }
  .pool .phead .iconbtn { margin-left: auto; }
  .pool .plist { flex: 1; overflow-y: auto; padding: 9px; display: flex; flex-direction: column; gap: 6px; }
  .pool .phint { font-size: 11px; color: var(--t5); text-align: center; padding: 2px 0 8px; }
  .pitem {
    flex: none; height: 34px; display: flex; align-items: center; gap: 9px;
    padding: 0 10px 0 0; border-radius: var(--r-sm); cursor: grab;
    background: color-mix(in srgb, var(--surface-raised) 72%, transparent);
    border: 1px solid color-mix(in srgb, var(--edge) 80%, transparent);
    touch-action: none;
  }
  .pitem:hover { border-color: var(--edge-strong); }
  .pitem::before { content: ""; width: 3px; height: 100%; border-radius: 3px 0 0 3px; background: var(--c); flex: none; }
  .pitem .t { font-size: 12px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pitem .chip {
    margin-left: auto; font-size: 10px; color: var(--t5);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 1px 6px; border-radius: 999px; background: var(--inset-bg);
  }
  /* 折叠态右缘把手 */
  .poolhandle {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%); z-index: 5;
    writing-mode: vertical-rl; padding: 14px 7px;
    border-radius: 10px 0 0 10px;
    background: var(--glass-bg); backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid var(--edge); border-right: none;
    box-shadow: var(--shadow-lg);
    font-size: 12px; color: var(--t3); letter-spacing: 0.08em;
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .poolhandle .count {
    writing-mode: horizontal-tb; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
  }
  html.dark .poolhandle .count { color: #101228; }
  .gridwrap:not(.pool-closed) .poolhandle { transform: translateY(-50%) translateX(120%); }

  /* ══════ 图例（右下，悬停高亮同色块） ══════ */
  .legend {
    position: absolute; right: 14px; bottom: 12px; z-index: 6;
    display: flex; gap: 4px; padding: 6px;
    border-radius: 999px;
  }
  .legend .li {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; cursor: default;
    font-size: 11px; color: var(--t4);
    transition: background-color 0.12s ease;
  }
  .legend .li:hover { background: var(--inset-bg); color: var(--t2); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3.5px; background: var(--c); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3); }

  /* ══════ 小样工具条（非应用 UI） ══════ */
  .mockbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 99;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--edge);
    font-size: 12px; color: var(--t4);
  }
  .mockbar b { color: var(--t2); font-weight: 600; }
  .mockbar .tb {
    padding: 4px 12px; border-radius: 999px; border: 1px solid var(--edge);
    color: var(--t3); font-size: 12px;
  }
  .mockbar .tb:hover { border-color: var(--edge-strong); color: var(--t1); }
  .mockbar .spring { flex: 1; }
  .app { padding-bottom: 37px; }
</style>
</head>
<body>
<div class="app">
  <!-- 导航栏 -->
  <aside class="rail">

    <div class="sect">任务卡</div>
    <button class="item active" data-ico="board">任务</button>
    <button class="item" data-ico="graph">图谱</button>
    <button class="item" data-ico="archive">归档</button>
    <button class="item" data-ico="folder">工作区</button>
    <button class="item" data-ico="trash">回收站</button>

      <div class="weeknav">
        <button class="iconbtn">‹</button>
        <span class="range" id="range">10月5日 – 10月11日</span>
        <button class="iconbtn">›</button>
      </div>
      <button class="chip">今天</button>
      <div class="spring"></div>
      <button class="pool-toggle" id="poolToggle"><span>▤</span>任务池 <span class="count" id="poolCount">7</span></button>
    </div>

    <div class="body-row" id="bodyRow">
      <!-- 左：任务卡详情（毛玻璃） -->

        <button class="iconbtn close" id="detailClose">✕</button>

<!-- 小样工具条 -->
<div class="mockbar">
  <b>视觉小样 v2</b><span>任务页 · 周时间网格</span>
  <button class="tb" id="themeBtn">切换亮 / 暗</button>
  <button class="tb" id="poolBtn">任务池 开/合</button>
  <button class="tb" id="detailBtn">详情面板 开/合</button>
  <div class="spring"></div>
  <span>可试：拖池中任务上轴（吸附 30 分）· 拖动/底缘拉伸已有块 · 图例悬停高亮</span>
</div>

<script>
  const HOUR = 64;            // 每小时行高 px
  const DAY_MIN = 10 * 60;    // 8:00–18:00
  const startMin = 8 * 60;

  // 小样固定演示周（2026-10-05 那周，今天 = 周三 10/7），保证截图可复现
  const DEMO = { weekLabel: "10月5日 – 10月11日", todayIdx: 2, nowMin: 14 * 60 + 20 };

  // 导航图标（内联 SVG，stroke 跟随文字色）
  const ICON_PATHS = {
    board: '<rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M9.5 3v18M14.5 3v13"/>',
    graph: '<circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M7 11l10-5M7 13l10 5"/>',
    archive: '<rect x="2.5" y="3.5" width="19" height="5" rx="1.5"/><path d="M4.5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V8.5M10 12.5h4"/>',
    folder: '<path d="M3 8a2 2 0 0 1 2-2h4l2.2 2.5H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>',
    trash: '<path d="M4 6.5h16M9.5 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7M6.5 6.5l.9 13a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4l.9-13"/>',
    flow: '<rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.5"/><rect x="15" y="15" width="6.5" height="6.5" rx="1.5"/><path d="M9 5.8h7a2 2 0 0 1 2 2V15M15 18.2H8a2 2 0 0 1-2-2V9"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.2"/>',
    pulse: '<path d="M3 12h3.5l2.5-6.5 4.5 13 2.5-6.5H21"/>',
    bell: '<path d="M6.3 9a5.7 5.7 0 0 1 11.4 0c0 6 1.8 7.5 1.8 7.5H4.5S6.3 15 6.3 9zM10 19.5a2.1 2.1 0 0 0 4 0"/>',
    gear: '<path d="M4 20v-6M4 10V4M12 20v-9M12 7V4M20 20v-4M20 12V4M2 14h4M10 7h4M18 16h4"/>',
  };
  document.querySelectorAll(".rail .item").forEach((el) => {
    el.insertAdjacentHTML("afterbegin",
      `<svg class="ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[el.dataset.ico]}</svg>`);
  });

  const PAL = { blue: "#4f7cf5", teal: "#2fb8ad", green: "#46c283", amber: "#e89b3c", violet: "#8b5cf6", slate: "#7a86a0" };
  const DOW = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  const DOW1 = "一二三四五六日";
  const fmtT = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const snap = (m) => Math.round(m / 30) * 30;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // 计划块数据（id 供拖拽定位）
  let uid = 0;
  const B = (d, s, e, t, c, x) => ({ id: ++uid, d, s, e, t, c, ...x });
  const blocks = [
    B(0, 540, 630, "梳理需求清单", "blue", { half: "l" }),
    B(0, 540, 630, "过一遍新拟态样式", "violet", { half: "r" }),
    B(0, 840, 900, "写周报", "teal"),
    B(1, 600, 720, "评审 OCR 分诊结论", "blue"),
    B(1, 960, 1020, "更新简历", "amber"),
    B(2, 570, 660, "任务页改版：周时间网格", "violet", { sel: true }),
    B(2, 780, 810, "周末采购清单", "green"),
    B(3, 660, 750, "准备周会演示", "amber"),
    B(4, 1050, 1110, "准备异地演示材料", "blue", { wrapTail: true }),
    B(5, 480, 510, "准备异地演示材料（续）", "blue", { wrapHead: true }),
    B(5, 600, 690, "长跑 10 公里", "green"),
    B(6, 900, 960, "规划下周", "slate"),
  ];

  // 池：全部未完成（含已排期 → 时间角标）
  const pool = [
    { t: "评审 OCR 分诊结论", c: "blue", at: "二 10:00" },
    { t: "任务页改版：周时间网格", c: "violet", at: "三 9:30" },
    { t: "更新简历", c: "amber", at: "二 16:00" },
    { t: "周末采购清单", c: "green", at: "三 13:00" },
    { t: "准备周会演示", c: "amber", at: "四 11:00" },
    { t: "读 DDIA 架构章", c: "slate" },
    { t: "整理云端相册并清理重复照片", c: "teal" },
  ];
  const TAGS = [
    { label: "设计", c: "violet" }, { label: "开发", c: "blue" }, { label: "文档", c: "teal" },
    { label: "健康", c: "green" }, { label: "日常", c: "slate" }, { label: "行政", c: "amber" },
  ];

  const jsDay = DEMO.todayIdx;
  const dayDates = [5, 6, 7, 8, 9, 10, 11];        // 2026-10-05 那周的周一~周日
  document.getElementById("range").textContent = DEMO.weekLabel;

  // 列头
  document.getElementById("dayhead").innerHTML = `<div class="cell"></div>` + DOW.map((w, i) => {
    const cls = ["cell", i === jsDay ? "today" : "", i >= 5 ? "weekend" : ""].join(" ");
    return `<div class="${cls}"><div class="dow">${w}</div><div class="dnum num">${dayDates[i]}</div></div>`;
  }).join("");

  const colH = HOUR * 10;
  const gridbody = document.getElementById("gridbody");

  // 时刻轴 + 虚线刻度（小时实距虚线 + 半点淡虚线，垫在列下层）
  function renderGrid() {
    let html = `<div class="hours" style="height:${colH}px;grid-row:1">` +
      Array.from({ length: 11 }, (_, i) =>
        `<span class="num" style="top:${i * HOUR}px">${String(8 + i).padStart(2, "0")}:00</span>`).join("") + `</div>`;
    html += `<div class="lines" style="position:absolute;left:0;top:0;right:0;height:${colH}px;z-index:0">`;
    for (let i = 0; i <= 10; i++)
      html += `<div class="hline" style="top:${i * HOUR}px"></div>`;
    for (let i = 0; i < 10; i++)
      html += `<div class="hline hh" style="top:${i * HOUR + HOUR / 2}px"></div>`;
    html += `</div>`;
    for (let d = 0; d < 7; d++) {
      const cls = ["col", d === jsDay ? "today" : "", d >= 5 ? "weekend" : ""].join(" ");
      html += `<div class="${cls} blocks" data-day="${d}" style="height:${colH}px"></div>`;
    }
    gridbody.innerHTML = html;
    // 现在时刻线：挂进今天列（相对列宽定位）
    const grid = document.getElementById("gridbody");
    const nowTop = ((DEMO.nowMin - startMin) / DAY_MIN) * colH;
    grid.querySelector(`.col.blocks[data-day="${jsDay}"]`).insertAdjacentHTML("beforeend", nowlineHtml());
  }

  function blockHtml(b) {
    const top = ((b.s - startMin) / DAY_MIN) * colH;
    const h = Math.max(((b.e - b.s) / DAY_MIN) * colH, 20);
    const half = b.half === "l" ? "half" : b.half === "r" ? "half r" : "";
    const seg = b.wrapTail ? "tail" : b.wrapHead ? "head" : "";
    const tiny = h < 48 ? "tiny" : "";
    const cont = b.wrapTail ? `<span class="cont">»</span>` : b.wrapHead ? `<span class="cont">«</span>` : "";
    return `<div class="blk ${half} ${seg} ${tiny} ${b.sel ? "sel" : ""} ${b.fresh ? "fresh" : ""}" data-id="${b.id}"
      style="--c:${PAL[b.c]};top:${top}px;height:${h - 2}px">
      <span class="dot s"></span><span class="dot e"></span>
      <div class="t">${b.t}</div>
      ${tiny ? "" : `<span class="tm num">${b.half ? fmtT(b.s) : `${fmtT(b.s)} – ${fmtT(b.e)}`}</span>`}
      ${cont}<span class="grip" data-grip="${b.id}"></span></div>`;
  }

  function nowlineHtml() {
    const nowTop = ((DEMO.nowMin - startMin) / DAY_MIN) * colH;
    return `<div class="nowline" style="top:${nowTop}px"><span class="lab">现在 ${fmtT(DEMO.nowMin)}</span></div>`;
  }

  function renderBlocks(f, keepFresh) {
    gridbody.querySelectorAll(".col.blocks").forEach((col) => {
      const d = Number(col.dataset.day);
      col.innerHTML = blocks.filter((b) => b.d === d && (!f || f(b))).map(blockHtml).join("")
        + (d === jsDay ? nowlineHtml() : "");
    });
    blocks.forEach((b) => { delete b.fresh; });
    bindBlockEvents();
  }

  // 池
  function renderPool() {
    document.getElementById("plist").innerHTML = pool.map((p, i) =>
      `<div class="pitem" data-pool="${i}" style="--c:${PAL[p.c]}"><span class="t">${p.t}</span>${p.at ? `<span class="chip num">${p.at}</span>` : ""}</div>`).join("");
    document.getElementById("poolSub").textContent = `${pool.length} 个未完成`;
    ["poolCount", "handleCount"].forEach((id) => (document.getElementById(id).textContent = pool.length));
    bindPoolEvents();
  }

  // 图例
  const legend = document.getElementById("legend");
  legend.innerHTML = TAGS.map((t) =>
    `<span class="li" data-c="${t.c}"><span class="sw" style="--c:${PAL[t.c]}"></span>${t.label}</span>`).join("");
  legend.querySelectorAll(".li").forEach((li) => {
    li.addEventListener("mouseenter", () => {
      gridbody.classList.add("filtering");
      gridbody.querySelectorAll(".blk").forEach((el) => {
        const b = blocks.find((x) => String(x.id) === el.dataset.id);
        el.classList.toggle("f-match", !!b && b.c === li.dataset.c);
      });
    });
    li.addEventListener("mouseleave", () => gridbody.classList.remove("filtering"));
  });

  /* ══════ 交互：拖池上轴 / 移动块 / 底缘拉伸（pointer 实现，吸附 30 分钟） ══════ */
  const gridwrapEl = document.getElementById("gridwrap");
  let ghost = null, slotEl = null;

  function colRects() {
    return [...gridbody.querySelectorAll(".col.blocks")].map((c) => ({ d: Number(c.dataset.day), r: c.getBoundingClientRect() }));
  }
  function locate(x, y, rects) {
    for (const { d, r } of rects)
      if (x >= r.left && x <= r.right && y >= r.top - 20 && y <= r.bottom + 20)
        return { d, min: clamp(snap(startMin + ((y - r.top) / r.height) * DAY_MIN), startMin, startMin + DAY_MIN - 30) };
    return null;
  }
  function showGhost(x, y, c, t, min, dur, day) {
    if (!ghost) { ghost = document.createElement("div"); ghost.className = "ghost"; document.body.appendChild(ghost); }
    ghost.style.setProperty("--c", PAL[c]);
    ghost.style.left = x + 14 + "px"; ghost.style.top = y - 14 + "px";
    ghost.innerHTML = `<div class="t">${t}</div><div class="gt">${DOW1[day]} ${fmtT(min)} – ${fmtT(min + dur)}</div>`;
  }
  function showSlot(day, min, dur) {
    if (!slotEl) { slotEl = document.createElement("div"); slotEl.className = "slot"; }
    const col = gridbody.querySelector(`.col.blocks[data-day="${day}"]`);
    col.appendChild(slotEl);
    const top = ((min - startMin) / DAY_MIN) * colH;
    const h = Math.max((dur / DAY_MIN) * colH, 20);
    slotEl.style.top = top + "px"; slotEl.style.height = h - 2 + "px";
  }
  function clearDragFx() { ghost?.remove(); ghost = null; slotEl?.remove(); slotEl = null; }

  function startDrag(e, payload) {
    e.preventDefault();
    const rects = colRects();
    let last = null;
    const move = (ev) => {
      const hit = locate(ev.clientX, ev.clientY, rects);
      last = hit;
      if (hit) { showGhost(ev.clientX, ev.clientY, payload.c, payload.t, hit.min, payload.dur, hit.d); showSlot(hit.d, hit.min, payload.dur); }
      else clearDragFx();
    };
    const up = (ev) => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      clearDragFx();
      const hit = locate(ev.clientX, ev.clientY, rects);
      if (!hit) return;
      payload.onDrop(hit.d, hit.min);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  function bindPoolEvents() {
    document.querySelectorAll(".pitem").forEach((el) => {
      const p = pool[Number(el.dataset.pool)];
      el.onpointerdown = (e) => {
        el.classList.add("dragging-src");
        startDrag(e, {
          c: p.c, t: p.t, dur: 60,
          onDrop: (d, min) => {
            el.classList.remove("dragging-src");
            blocks.push(B(d, min, min + 60, p.t, p.c, { fresh: true }));
            p.at = `${DOW1[d]} ${fmtT(min)}`;
            renderBlocks(); renderPool();
          },
        });
        const clear = () => { el.classList.remove("dragging-src"); window.removeEventListener("pointerup", clear); };
        window.addEventListener("pointerup", clear);
      };
    });
  }

  function bindBlockEvents() {
    gridbody.querySelectorAll(".blk").forEach((el) => {
      const b = blocks.find((x) => String(x.id) === el.dataset.id);
      el.addEventListener("click", () => {
        blocks.forEach((x) => (x.sel = false));
        b.sel = true;
        gridbody.querySelectorAll(".blk").forEach((n) => n.classList.remove("sel"));
        el.classList.add("sel");
      });
      // 拖动整块（保持时长）
      el.onpointerdown = (e) => {
        if (e.target.dataset.grip) return;
        e.preventDefault();
        const dur = b.e - b.s;
        el.classList.add("dragging-src");
        startDrag(e, {
          c: b.c, t: b.t, dur,
          onDrop: (d, min) => {
            el.classList.remove("dragging-src");
            Object.assign(b, { d, s: min, e: min + dur, fresh: true, wrapTail: false, wrapHead: false, half: undefined });
            renderBlocks();
          },
        });
        const clear = () => { el.classList.remove("dragging-src"); window.removeEventListener("pointerup", clear); };
        window.addEventListener("pointerup", clear);
      };
      // 底缘握把：拉伸结束时间
      const grip = el.querySelector(".grip");
      grip.onpointerdown = (e) => {
        e.stopPropagation(); e.preventDefault();
        const rects = colRects();
        const move = (ev) => {
          const hit = locate(ev.clientX, ev.clientY, rects);
          if (hit && hit.d === b.d) showSlot(b.d, b.s, Math.max(hit.min - b.s, 30));
        };
        const up = (ev) => {
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
          slotEl?.remove(); slotEl = null;
          const r = rects.find((x) => x.d === b.d).r;
          const min = clamp(snap(startMin + ((ev.clientY - r.top) / r.height) * DAY_MIN), b.s + 30, startMin + DAY_MIN);
          b.e = min; b.fresh = true;
          renderBlocks();
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      };
    });
  }

  renderGrid();
  renderBlocks();
  renderPool();

  // 主题 / 池 / 详情切换
  const $ = (id) => document.getElementById(id);
  $("themeBtn").onclick = () => document.documentElement.classList.toggle("dark");
  $("poolToggle").onclick = $("poolClose").onclick = $("poolBtn").onclick = () =>
    gridwrapEl.classList.toggle("pool-closed");
  $("poolHandle").onclick = () => gridwrapEl.classList.remove("pool-closed");
  $("detailBtn").onclick = () => $("bodyRow").classList.toggle("no-detail");
  $("detailClose").onclick = () => $("bodyRow").classList.add("no-detail");
</script>
</body>
</html>
