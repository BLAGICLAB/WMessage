<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务图谱 GUI 冒烟演示（浏览器 mock 渲染）</title>
    <script>
      // Tauri shim：让真实组件在浏览器里跑通数据面（与 vitest setup 同一手法）。
      // 数据与隔离目录 GUI 冒烟的 seed.sql 同源。
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "main" }, currentWebview: {} },
        transformCallback: (cb) => cb,
        invoke: (cmd) => {
          if (cmd === "workflow_list")
            return Promise.resolve([
              { id: "wf-demo-1", name: "周报流水线", goal: "自动汇总本周任务出周报" },
              { id: "wf-demo-2", name: "官网部署", goal: "构建并部署官网" },
            ]);
          if (cmd === "people_list")
            return Promise.resolve([
              { id: "self-demo-0001", name: "任", isSelf: true },
              { id: "p-zhang-demo", name: "张三", isSelf: false },
              { id: "p-li-demo", name: "李四", isSelf: false },
            ]);
          // 标签近义对：demo 无嵌入引擎，空数组 = 无近义组（GraphPage 合法入参）
          if (cmd === "tag_similar_pairs") return Promise.resolve([]);
          // 事件 API（GraphPage 监听 tasks-changed）：注册成功、无事件派发
          if (cmd === "plugin:event|listen") return Promise.resolve(1);
          if (cmd === "plugin:event|unlisten") return Promise.resolve(null);
          // 未 mock 的命令必须显式失败：静默空数据会把组件契约回归
          // 掩盖成「截图正常、测试通过」
          console.warn("[tauri-shim] unmocked command:", cmd);
          return Promise.reject(new Error(`tauri-shim: unmocked command "${cmd}"`));
        },
      };
      window.__errors = [];
      window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
      // 异步失败对称捕获：未处理 rejection 同样进 __errors（不 preventDefault，
      // 让浏览器控制台也能看到）
      window.addEventListener("unhandledrejection", (e) => {
        window.__errors.push(String(e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    </script>
    <script type="module" src="./graph-demo-entry.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
