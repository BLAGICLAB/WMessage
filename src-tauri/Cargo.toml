[package]
name = "wmessage"
version = "0.1.0"
description = "WMessage - 任务看板 + AI 助手桌面应用"
authors = ["张晓峰 <zxf_83117@163.com>"]
edition = "2021"
default-run = "wmessage"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wmessage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# 单实例：Windows 上多次双击 exe 不再开出多个前端，二次启动唤起已有主窗口
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# 系统通知：任务卡截止前 1 小时 / 截止时刻提醒（due_notify 模块）
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# 开机自启动：登录系统时自动拉起 wmessage（设置页「通用设置」里开关控制）
tauri-plugin-autostart = "2"

rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"

# 本地 HTTP API（127.0.0.1 微服务 + SSE）
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

# 内置机器人：调大模型 API（流式 SSE + 工具调用）
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }

# 联网工具：抓网页（HTML→纯文本、GBK 解码、URL 校验）
html2text = "0.13"
encoding_rs = "0.8"
url = "2"

# 图片附件：base64 编码后作为多模态消息发给 MiniMax
base64 = "0.22"

# 规则表 CSV 导入（Excel/WPS 表格模版）
csv = "1"

# 危险操作确认：挂件弹窗等待用户批准/拒绝（oneshot 通道 + 超时）
tokio = { version = "1", features = ["sync", "time"] }

# 前置意图路由关键词/正则匹配（老板 2026-08-17 18:14 Q1 拍板）
regex = "1"

# 跨平台垃圾箱：macOS 废纸篓 / Windows 回收站 / Linux gio trash（老板 2026-08-17 21:17）
trash = "5"

# 记忆 v2（2026-09-09，docs/BOT-MEMORY-V2-DESIGN.md）：本地语义嵌入
# ort = ONNX Runtime 绑定（download-binaries：build script 自动下载 onnxruntime 动态库，
# 网络失败时构建期报错的应对见设计文档「模型打包说明」节）
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
# tokenizers：仅离线加载 tokenizer.json（default-features 全关：不拉 http；
# fancy-regex 是 tokenizers 0.23 必需的 regex 后端之一，纯 Rust 无 C 依赖）
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# OCR 原子工具（ocr_image，2026-09-10）：图片解码（PNG/JPEG，纯 Rust，不进网络）；
# macOS 走系统 Vision（objc2-vision），Windows 走本地 PP-OCRv6 ONNX（复用上面的 ort）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Windows 交叉编译（x86_64-pc-windows-gnu）：ort 官方预编译库无 gnu target，
# 叠加 load-dynamic（特性取并集）→ ort-sys disable-linking，构建期不下载不链接，
# 运行时按名加载 onnxruntime.dll（随绿色包放 exe 同目录）；macOS 路径不受影响。
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }

[dev-dependencies]
# F-6 端到端测试：mock Tauri runtime + 集成测试 runner（2026-08-18）
tauri = { version = "2", features = ["test"] }
tempfile = "3"
futures = { version = "0.3", features = ["executor"] }
# F-6 step 3：mock LLM + reqwest 端到端需要 #[tokio::test] async 测试运行时
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 修订工具测试：解开 docx（zip）验证 word/document.xml 修订标记
# （deflate：docx 默认压缩算法；default-features=false 会把它关掉导致解压失败）
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# Python 子进程资源限额（C2）：setrlimit RLIMIT_AS / RLIMIT_CPU
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[patch.crates-io]
# 批次4审计 P1-1（2026-09-03）：vendor tiny_http 加 per-connection 读超时，
# 堵 accept 阶段 header slowloris。改动只有两处（均带 [wmessage patch] 标记）：
#   src/lib.rs        —— 新增 pub static HTTP_READ_TIMEOUT_MS（默认 30s，含取舍注释）
#   src/connection.rs —— Listener::accept 后 set_read_timeout
# 版本与 crates.io 0.12.0 一致（vendor 自 Cargo.lock 锁定的那份源码）
tiny_http = { path = "vendor/tiny_http" }
