[package]
name = "wmessage"
version = "0.1.0"
description = "WMessage - 任务看板 + AI 助手桌面应用"
authors = ["张晓峰 <zxf_83117@163.com>"]
edition = "2021"
default-run = "wmessage"

# B5-6（clippy 分级治理）：三类纯噪音 lint 显式放宽（各带理由；其余 0 warning
# 目标不变）。放宽 = 有意的工程决策并在此留痕，非漏修。
[lints.clippy]
# 文档列表续行格式（52 条）：历史文档的列表续行/新段落判定需逐条人工改写，
# 纯格式无运行时影响。机械化修复有改写文档语义的风险 → 登记 follow-up 手修
doc_lazy_continuation = "allow"
# 复杂类型（24 条）：集中在测试 mock 的执行器注入泛型签名与 LlmHttp 装配——
# 抽 type 别名会让签名更难读（类型拼写移出定义点），测试代码可读性优先
type_complexity = "allow"
# 参数个数（4 条）：run_model_loop 等装配入口，参数皆为必要依赖注入；
# 收拢成 struct 只是换个形式的样板代码
too_many_arguments = "allow"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wmessage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# 单实例：Windows 上多次双击 exe 不再开出多个前端，二次启动唤起已有主窗口
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# 系统通知：任务卡截止前 1 小时 / 截止时刻提醒（due_notify 模块）
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# 开机自启动：登录系统时自动拉起 wmessage（设置页「通用设置」里开关控制）
tauri-plugin-autostart = "2"
# 剪贴板写入（N4 clipboard_write 工具）：官方插件 v2，Rust 侧 ClipboardExt::write_text
tauri-plugin-clipboard-manager = "2"

rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
# 日志门面（标准宏 log::warn! 等直落 audit bot.log）：stdlib 无此能力，
# 自造宏是重复造轮子——log crate 零传递依赖、社区唯一事实标准。
# std 必须显式开：0.4.33 起移除了 default feature（不开则 set_boxed_logger 不存在）
log = { version = "0.4", features = ["std"] }

# 本地 HTTP API（127.0.0.1 微服务 + SSE）
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

# 内置机器人：调大模型 API（流式 SSE + 工具调用）
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }

# 联网工具：抓网页（HTML→纯文本、GBK 解码、URL 校验）
html2text = "0.13"
encoding_rs = "0.8"
url = "2"

# 图片附件：base64 编码后作为多模态消息发给 MiniMax
base64 = "0.22"

# 执行透明化（Agent 透明化设计 §4.2 P1-b）：文件修改 diff 生成 + 回滚证据链哈希
similar = "2"
sha2 = "0.10"

# 规则表 CSV 导入（Excel/WPS 表格模版）
csv = "1"

# per-onion 配置文件（<数据目录>/onions/<id>.yaml）解析。
# 为什么不是 serde_json：这些 yaml 是要被人手改的，三份样例里全是行内说明注释，
# JSON 承载不了注释，改好的配置会变成黑盒。
# 为什么是 yaml_serde 而不是 serde_yaml / serde_yml：serde_yaml 0.9 已废弃
# （RUSTSEC-2024-0320，2024-03-25 后无更新）；serde_yml 0.0.13 是同作者的兼容壳、
# 其文档已指向自己的继任者 noyalib，而 noyalib 仍在 0.0.x（零 API 稳定性承诺）。
# yaml_serde 是 YAML 官方组织（dtolnay 移交后）维护的分支，API 与 serde_yaml 同源，
# 正常依赖只有 indexmap/itoa/libyaml-rs/ryu/serde 五个小库。
yaml_serde = "0.10"

# 危险操作确认：挂件弹窗等待用户批准/拒绝（oneshot 通道 + 超时）
tokio = { version = "1", features = ["sync", "time", "rt"] }

# 前置意图路由关键词/正则匹配（老板 2026-08-17 18:14 Q1 拍板）
regex = "1"

# 跨平台垃圾箱：macOS 废纸篓 / Windows 回收站 / Linux gio trash（老板 2026-08-17 21:17）
trash = "5"

# 记忆 v2（2026-09-09，docs/BOT-MEMORY-V2-DESIGN.md）：本地语义嵌入
# ort = ONNX Runtime 绑定（download-binaries：build script 自动下载 onnxruntime 动态库，
# 网络失败时构建期报错的应对见设计文档「模型打包说明」节）
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
# tokenizers：仅离线加载 tokenizer.json（default-features 全关：不拉 http；
# fancy-regex 是 tokenizers 0.23 必需的 regex 后端之一，纯 Rust 无 C 依赖）
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# OCR 原子工具（ocr_image，2026-09-10）：图片解码（PNG/JPEG，纯 Rust，不进网络）；
# macOS 走系统 Vision（objc2-vision），Windows 走本地 PP-OCRv6 ONNX（复用上面的 ort）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# MCP 宿主（2026-09-28 拍板 1B）：官方 SDK，wmessage 作为 Host/Client 连外部 MCP 服务器。
# default-features 关掉 server 侧（default = base64, macros, server——宿主场景不用 server，
# 且其 Streamable HTTP 服务端有 CVE-2026-63128 历史，客户端只留最小攻击面）。
# stdio（子进程 stdin/stdout）+ Streamable HTTP（远程端点，reqwest 0.13 与主工程同源）。
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

# 归档工具（unpack_archive / pack_archive）：zip 与 tar.gz 的解包 / 打包。
# 为什么是这三个 crate：std 没有归档支持（无 zip / tar / gzip）；
# - zip 2.x 本来就在依赖树里（dev-dependency，修订工具测试解 docx 用），
#   提升为正式依赖不新增任何 crate——只开 deflate（docx 默认压缩算法），
#   bzip2 / zstd / aes 保持关闭：遇到就报「不支持的压缩算法」，不静默跳过。
# - tar 0.4：纯 Rust，无 C 依赖；tar.gz 的容器格式（ustar/pax/gnu 长名都它管）。
# - flate2 1.x：gzip 后端走 miniz_oxide（纯 Rust），跨平台预编译一致。
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# Windows 交叉编译（x86_64-pc-windows-gnu）：ort 官方预编译库无 gnu target，
# 叠加 load-dynamic（特性取并集）→ ort-sys disable-linking，构建期不下载不链接，
# 运行时按名加载 onnxruntime.dll（随绿色包放 exe 同目录）；macOS 路径不受影响。
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }

[dev-dependencies]
# F-6 端到端测试：mock Tauri runtime + 集成测试 runner（2026-08-18）
tauri = { version = "2", features = ["test"] }
tempfile = "3"
futures = { version = "0.3", features = ["executor"] }
# F-6 step 3：mock LLM + reqwest 端到端需要 #[tokio::test] async 测试运行时
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 读流层的单测要在内存里造一个 reqwest::Response（喂 SSE 数据块）。
# 为什么需要它：reqwest 0.13 不再转出 http crate，而 reqwest::Response 除
# `From<http::Response<T>>` 外没有公开构造口。http 本就随 reqwest 进依赖树
# （同一 1.x 线），此处只作 dev 依赖声明，不新增任何 crate。
http = "1"
# 修订工具测试：解开 docx（zip）验证 word/document.xml 修订标记
# （deflate：docx 默认压缩算法；default-features=false 会把它关掉导致解压失败）
# zip 已提升为正式依赖（归档工具要用），这里不再重复声明——dev 段继承正式段。

[target.'cfg(unix)'.dependencies]
# Python 子进程资源限额（C2）：setrlimit RLIMIT_AS / RLIMIT_CPU
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-vision = "0.3"
# UI 自动化（macOS）：AX 读 UI 树 + CGEvent 注入。
# objc2-application-services：AXUIElement（AXUIElementCreateApplication /
# AXUIElementCopyAttributeValue / AXUIElementPerformAction / AXIsProcessTrusted）；
# objc2-core-graphics：CGEvent 造鼠标/键盘事件并 post 到 HID 层。
# 不引第三方 crate：Apple 的 Accessibility.framework / CoreGraphics 本身有 objc2 绑定。
objc2-application-services = { version = "0.3", features = [
    "AXUIElement",
    "AXAttributeConstants",
    "AXConstants",
    "AXError",
    "AXActionConstants",
    "AXRoleConstants",
    "AXValue",
    "std",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
# objc2-core-foundation：AX 属性的 CF 类型（CFString / CFArray / AXValue 承载）
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFString"] }

[target.'cfg(windows)'.dependencies]
# Threading：JobObjects 的 JOBOBJECT_EXTENDED_LIMIT_INFORMATION 挂在此 feature 下（py/runtime.rs）
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    # 剥「来自互联网」标记（Zone.Identifier 备用数据流）：CreateFileW +
    # SetFileInformationByHandle(FileDispositionInfo)（platform/zone_id.rs）
    # Win32_System_IO 随 WriteFile 引入——写测试用的标记流要写内容
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # UI 自动化（Windows）：COM 初始化（UIAutomation 是 COM 接口）
    "Win32_System_Com",
    "Win32_UI_Shell",
    # UI 自动化（Windows）：UIAutomation 读控件树 + SendInput 注鼠标键盘
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
# 批次4审计 P1-1（2026-09-03）：vendor tiny_http 加 per-connection 读超时，
# 堵 accept 阶段 header slowloris。改动只有两处（均带 [wmessage patch] 标记）：
#   src/lib.rs        —— 新增 pub static HTTP_READ_TIMEOUT_MS（默认 30s，含取舍注释）
#   src/connection.rs —— Listener::accept 后 set_read_timeout
# 版本与 crates.io 0.12.0 一致（vendor 自 Cargo.lock 锁定的那份源码）
tiny_http = { path = "vendor/tiny_http" }
